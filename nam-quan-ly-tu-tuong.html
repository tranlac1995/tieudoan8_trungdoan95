<style>

body{

.square-lesson:hover{

}

.square-lesson p{

/* KHUNG NỘI DUNG */

}

#lesson-content h2{
  color:#123f70;

  padding-bottom:12px;

}

#lesson-content h3{
  color:#174c7e;
  margin:20px 0 12px;
}

#lesson-content p{
  line-height:1.7;
  color:#455b70;
}

/* FORM */
input,select,textarea{
  width:100%;
  padding:11px 12px;
  margin:6px 0 13px;
  border-radius:8px;
  border:1px solid #cbd6e2;
  font-family:inherit;
  font-size:14px;
  background:white;
}

input:focus,select:focus,textarea:focus{
  outline:none;
  border-color:#2474b9;
  box-shadow:0 0 0 3px rgba(36,116,185,.12);
}

label{
  display:block;
  font-weight:bold;
  color:#244a70;
  margin-top:8px;
}

/* BUTTON */
button{
  background:var(--secondary);
  color:#fff;
  border:none;
  border-radius:9px;
  padding:10px 16px;
  margin:4px 3px;
  cursor:pointer;
  font-size:14px;
  font-weight:bold;
  transition:.25s;
}

button:hover{

}

/* TABLE */
table{

  border-collapse:collapse;
  margin-top:12px;
  background:white;
  font-size:13px;
}

th,td{
  border:1px solid #d5dfe9;
  padding:10px 8px;
  text-align:left;
  line-height:1.5;
}

th{
  background:#eaf2ff;
  color:#173f6c;
  white-space:nowrap;
}

tr:nth-child(even){

}

#lesson-content ol{
  padding-left:25px;
}

#lesson-content ol li{

  color:#344f68;
  font-weight:500;
}

/* BIỂU ĐỒ */
canvas{
  max-width:100%;
}

/* RESPONSIVE */
@media(max-width:1000px){
  .grid-lessons{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:700px){
  body{

  }

  }

  }

  }

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
let indexSua=-1,indexKhaoSat=-1;

// ---------------- 1. HỒ SƠ QUÂN NHÂN ----------------

function hoso(){
  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  let options = ds.map((h,i)=>
    `<option value="${i}">${h.hoten}</option>`
  ).join('');

  document.getElementById("lesson-content").innerHTML=`
    <h2>📁 Hồ sơ quân nhân</h2>

    <label>Họ tên</label>
    <input id="hoten" placeholder="Nhập họ tên">

    <label>Giới tính</label>
    <select id="gioitinh">
      <option value="Nam">Nam</option>
      <option value="Nữ">Nữ</option>
    </select>

    <label>Ngày sinh</label>
    <input id="ngaysinh" type="date">

    <label>Cấp bậc</label>
    <input id="capbac" placeholder="Nhập cấp bậc">

    <label>Chức vụ</label>
    <input id="chucvu" placeholder="Nhập chức vụ">

    <label>Đơn vị</label>
    <input id="donvi" placeholder="Nhập đơn vị">

    <label>Nhận xét tư tưởng</label>
    <textarea id="nhanxet" rows="2"></textarea>

    <label>Lịch sử khen thưởng/kỷ luật</label>
    <textarea id="lichsu" rows="2"></textarea>

    <button onclick="luuHoSo()">💾 Lưu hồ sơ</button>

    <h3>Khảo sát tư tưởng quân nhân đã lưu</h3>

    <select id="chonNhanVien">
      <option value="">--Chọn quân nhân--</option>
      ${options}
    </select>

    <button onclick="chonKhaoSatDropdown()">📝 Khảo sát</button>
  `;
}

// ---------------- LƯU HỒ SƠ VÀ GỬI SHEETS ----------------

function luuHoSo(){

  let hs = {
    hoten: document.getElementById("hoten").value,
    gioitinh: document.getElementById("gioitinh").value,
    ngaysinh: document.getElementById("ngaysinh").value,
    capbac: document.getElementById("capbac").value,
    chucvu: document.getElementById("chucvu").value,
    donvi: document.getElementById("donvi").value,
    nhanxet: document.getElementById("nhanxet").value,
    lichsu: document.getElementById("lichsu").value,
    diem: null,
    ketqua: null,
    theoDoi: []
  };

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  if(indexSua == -1){
    ds.push(hs);
  }else{
    ds[indexSua] = hs;
  }

  localStorage.setItem("hosoQN", JSON.stringify(ds));
  indexSua = -1;

  fetch("https://script.google.com/macros/s/AKfycbzEPb6s06uc6OeVpfkspSSnITZBS04ObtHXYXT6YNjFdqUGubrkOjVHnNCU8p7aaAXNEw/exec", {
    method:"POST",
    body:JSON.stringify(hs),
    headers:{"Content-Type":"application/json"}
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.status==="ok"){
      console.log("Lưu lên Google Sheets thành công!");
    }else{
      console.warn("Lỗi khi lưu lên Sheets:",data.message);
    }
  })
  .catch(err=>console.error("Lỗi kết nối:",err.message));

  excelView();
}

// ---------------- 2. PHIẾU KHẢO SÁT ----------------

function chonKhaoSatDropdown(){

  let index = document.getElementById("chonNhanVien").value;

  if(index === ""){
    alert("Vui lòng chọn quân nhân!");
    return;
  }

  indexKhaoSat = +index;
  khaosat();
}

function chonKhaoSat(i){
  indexKhaoSat=i;
  khaosat();
}

function khaosat(){

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  let target = (indexKhaoSat != -1) ? ds[indexKhaoSat] : null;

  document.getElementById("lesson-content").innerHTML = `

    <h2>📝 Phiếu khảo sát tư tưởng 10 câu</h2>

    <p>Quân nhân:
      <b>${target ? target.hoten : "(Chưa chọn)"}</b>
    </p>

    <ol>

      <li>Tinh thần công tác
        <select id="q1">
          <option value="3">Tốt</option>
          <option value="2">Bình thường</option>
          <option value="1">Chưa tốt</option>
        </select>
      </li>

      <li>Kỷ luật
        <select id="q2">
          <option value="3">Tốt</option>
          <option value="2">Bình thường</option>
          <option value="1">Chưa tốt</option>
        </select>
      </li>

      <li>Tâm lý
        <select id="q3">
          <option value="3">Ổn định</option>
          <option value="2">Khó khăn</option>
          <option value="1">Bất ổn</option>
        </select>
      </li>

      <li>Học tập/Đào tạo
        <select id="q4">
          <option value="3">Tốt</option>
          <option value="2">Trung bình</option>
          <option value="1">Chưa đạt</option>
        </select>
      </li>

      <li>Quan hệ đồng đội
        <select id="q5">
          <option value="3">Tốt</option>
          <option value="2">Bình thường</option>
          <option value="1">Cần cải thiện</option>
        </select>
      </li>

      <li>Chấp hành mệnh lệnh cấp trên
        <select id="q6">
          <option value="3">Tốt</option>
          <option value="2">Bình thường</option>
          <option value="1">Cần cải thiện</option>
        </select>
      </li>

      <li>Động lực công việc
        <select id="q7">
          <option value="3">Cao</option>
          <option value="2">Trung bình</option>
          <option value="1">Thấp</option>
        </select>
      </li>

      <li>Ý thức an toàn, phòng chống rủi ro
        <select id="q8">
          <option value="3">Tốt</option>
          <option value="2">Trung bình</option>
          <option value="1">Cần cải thiện</option>
        </select>
      </li>

      <li>Tinh thần phục vụ cộng đồng
        <select id="q9">
          <option value="3">Tích cực</option>
          <option value="2">Bình thường</option>
          <option value="1">Chưa tích cực</option>
        </select>
      </li>

      <li>Quản lý stress, xung đột
        <select id="q10">
          <option value="3">Tốt</option>
          <option value="2">Trung bình</option>
          <option value="1">Cần hỗ trợ</option>
        </select>
      </li>

    </ol>

    <button onclick="tinhDiem()">📊 Chấm điểm</button>

    <p id="ketqua" style="margin-top:15px;"></p>
  `;
}

// ---------------- TÍNH ĐIỂM ----------------

function tinhDiem10(){

  let d =
    +q1.value + +q2.value + +q3.value +
    +q4.value + +q5.value + +q6.value +
    +q7.value + +q8.value + +q9.value +
    +q10.value;

  let kq = d >= 25 ? "Ổn định" :
           d >= 15 ? "Cần theo dõi" : "Cảnh báo";

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  if(indexKhaoSat != -1){
    ds[indexKhaoSat].diem = d;
    ds[indexKhaoSat].ketqua = kq;

    localStorage.setItem("hosoQN",JSON.stringify(ds));
  }

  document.getElementById("ketqua").innerHTML =
    `Điểm: ${d} → <b>${kq}</b>`;
}

function tinhDiem(){

  let q1v = +document.getElementById("q1").value;
  let q2v = +document.getElementById("q2").value;
  let q3v = +document.getElementById("q3").value;
  let q4v = +document.getElementById("q4").value;
  let q5v = +document.getElementById("q5").value;
  let q6v = +document.getElementById("q6").value;
  let q7v = +document.getElementById("q7").value;
  let q8v = +document.getElementById("q8").value;
  let q9v = +document.getElementById("q9").value;
  let q10v = +document.getElementById("q10").value;

  let d = q1v + q2v + q3v + q4v + q5v +
          q6v + q7v + q8v + q9v + q10v;

  let kq = d >= 25 ? "Ổn định" :
           d >= 15 ? "Cần theo dõi" : "Cảnh báo";

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  if(indexKhaoSat != -1 && ds[indexKhaoSat]){

    ds[indexKhaoSat].diem = d;
    ds[indexKhaoSat].ketqua = kq;

    ds[indexKhaoSat].theoDoi = ds[indexKhaoSat].theoDoi || [];

    ds[indexKhaoSat].theoDoi.push({
      ngay:new Date().toISOString().split('T')[0],
      diem:d
    });

    localStorage.setItem("hosoQN",JSON.stringify(ds));
  }

  document.getElementById("ketqua").innerHTML =
    `Điểm: ${d} → <b>${kq}</b>`;
}

// ---------------- 3. DANH SÁCH VÀ XUẤT EXCEL ----------------

function excelView(){

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  let html = "<h2>💾 Danh sách quân nhân & Xuất Excel</h2>";

  if(ds.length===0){

    html += "<p>Chưa có dữ liệu.</p>";

  }else{

    html += `<table>
      <tr>
        <th>Họ tên</th>
        <th>Giới tính</th>
        <th>Ngày sinh</th>
        <th>Cấp bậc</th>
        <th>Chức vụ</th>
        <th>Đơn vị</th>
        <th>Nhận xét</th>
        <th>Lịch sử</th>
        <th>Điểm</th>
        <th>KQ tư tưởng</th>
        <th>Hành động</th>
      </tr>`;

    ds.forEach((h,i)=>{

      html += `<tr>
        <td>${h.hoten}</td>
        <td>${h.gioitinh}</td>
        <td>${h.ngaysinh}</td>
        <td>${h.capbac}</td>
        <td>${h.chucvu}</td>
        <td>${h.donvi}</td>
        <td>${h.nhanxet}</td>
        <td>${h.lichsu}</td>
        <td>${h.diem||""}</td>
        <td>${h.ketqua||""}</td>
        <td>
          <button onclick="xoaNhanVien(${i})">❌ Xóa</button>
        </td>
      </tr>`;

    });

    html += "</table>";

    html += `
      <button onclick="xuatExcel()">
        📥 Xuất Excel & Gửi Sheets
      </button>
    `;
  }

  document.getElementById("lesson-content").innerHTML = html;
}

// ---------------- XÓA QUÂN NHÂN ----------------

function xoaNhanVien(i){

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  if(!ds[i]) return;

  if(confirm(`Bạn có chắc muốn xóa quân nhân "${ds[i].hoten}" không?`)){

    ds.splice(i,1);

    localStorage.setItem("hosoQN",JSON.stringify(ds));

    excelView();
  }
}

// ---------------- XUẤT EXCEL ----------------

function xuatExcel(){

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  if(ds.length===0){
    alert("Chưa có dữ liệu để xuất!");
    return;
  }

  let csv =
    "Ho ten,Gioi tinh,Ngay sinh,Cap bac,Chuc vu,Don vi,Nhan xet,Lich su,Diem,Ket qua\n";

  ds.forEach(h=>{

    let row = [
      h.hoten,
      h.gioitinh,
      h.ngaysinh,
      h.capbac,
      h.chucvu,
      h.donvi,
      h.nhanxet,
      h.lichsu,
      h.diem||"",
      h.ketqua||""
    ];

    csv += row.map(v=>
      `"${String(v??"").replace(/"/g,'""')}"`
    ).join(",") + "\n";

  });

  let blob = new Blob(["\uFEFF"+csv],{
    type:"text/csv;charset=utf-8;"
  });

  let a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = "ho-so-quan-nhan.csv";
  a.click();

  URL.revokeObjectURL(a.href);

  // GỬI LÊN GOOGLE SHEETS
  ds.forEach(hs=>{

    fetch("https://script.google.com/macros/s/AKfycbzEPb6s06uc6OeVpfkspSSnITZBS04ObtHXYXT6YNjFdqUGubrkOjVHnNCU8p7aaAXNEw/exec",{
      method:"POST",
      body:JSON.stringify(hs),
      headers:{"Content-Type":"application/json"}
    })
    .then(res=>res.json())
    .then(data=>{
      if(data.status==="ok"){
        console.log(`Đã gửi ${hs.hoten} lên Sheets`);
      }else{
        console.warn("Lỗi khi gửi:",data.message);
      }
    })
    .catch(err=>console.error("Lỗi kết nối:",err.message));

  });
}

// ---------------- 4. BÁO CÁO THỐNG KÊ ----------------

function baocao(){

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  let html = "<h2>📊 Báo cáo thống kê</h2>";

  html += `
    <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:center;">
      <div style="flex:1;min-width:260px;">
        <canvas id="chartBar"></canvas>
      </div>
      <div style="flex:1;min-width:260px;max-width:350px;">
        <canvas id="chartPie"></canvas>
      </div>
    </div>
    <div id="dsLoc" style="margin-top:20px;"></div>
  `;

  document.getElementById("lesson-content").innerHTML = html;

  let count = {
    "Ổn định":0,
    "Cần theo dõi":0,
    "Cảnh báo":0
  };

  ds.forEach(h=>{
    if(h.ketqua) count[h.ketqua]++;
  });

  new Chart(document.getElementById('chartBar').getContext('2d'),{

    type:'bar',

    data:{
      labels:["Ổn định","Cần theo dõi","Cảnh báo"],
      datasets:[{
        label:"Số quân nhân",
        data:[
          count["Ổn định"],
          count["Cần theo dõi"],
          count["Cảnh báo"]
        ],
        backgroundColor:["#28a745","#ffc107","#dc3545"]
      }]
    },

    options:{
      responsive:true,

      plugins:{
        legend:{display:false}
      },

      scales:{
        y:{beginAtZero:true}
      },

      onClick:function(evt,ele){

        if(ele.length>0){

          let kq = [
            "Ổn định",
            "Cần theo dõi",
            "Cảnh báo"
          ][ele[0].index];

          hienThiDanhSach(kq,null);
        }
      }
    }
  });

  let units={};

  ds.forEach(h=>{
    if(h.ketqua==="Cảnh báo"){
      units[h.donvi]=(units[h.donvi]||0)+1;
    }
  });

  let pieLabels=Object.keys(units);
  let pieData=Object.values(units);

  new Chart(document.getElementById('chartPie').getContext('2d'),{

    type:'pie',

    data:{
      labels:pieLabels,
      datasets:[{
        label:"Cảnh báo theo đơn vị",
        data:pieData,
        backgroundColor:pieLabels.map((_,i)=>
          ["#007bff","#28a745","#ffc107","#dc3545","#6f42c1"][i%5]
        )
      }]
    },

    options:{
      responsive:true,

      plugins:{
        legend:{
          position:'bottom',
          labels:{
            boxWidth:12,
            boxHeight:12,
            font:{size:11}
          }
        },

        tooltip:{
          callbacks:{
            label:function(context){

              let total=context.dataset.data.reduce((a,b)=>a+b,0);
              let value=context.raw;
              let percent=total ? ((value/total)*100).toFixed(1) : 0;

              return `${context.label}: ${value} quân nhân (${percent}%)`;
            }
          }
        }
      },

      onClick:function(evt,ele){

        if(ele.length>0){
          hienThiDanhSach("Cảnh báo",pieLabels[ele[0].index]);
        }
      }
    }
  });

  function hienThiDanhSach(kq,dv){

    let html="<h3>Danh sách quân nhân lọc</h3>";

    let filtered=ds.filter(h=>
      h.ketqua===kq && (!dv||h.donvi===dv)
    );

    if(filtered.length===0){

      html+="<p>Không có quân nhân nào phù hợp.</p>";

    }else{

      html+=`
        <table>
          <tr>
            <th>Họ tên</th>
            <th>Cấp bậc</th>
            <th>Đơn vị</th>
            <th>KQ tư tưởng</th>
          </tr>
      `;

      filtered.forEach(h=>{

        html+=`
          <tr>
            <td>${h.hoten}</td>
            <td>${h.capbac}</td>
            <td>${h.donvi}</td>
            <td>${h.ketqua}</td>
          </tr>
        `;
      });

      html+="</table>";
    }

    document.getElementById("dsLoc").innerHTML=html;
  }
}

// ---------------- 5. PHÂN TÍCH VÀ CẢNH BÁO ----------------

function canhbao(){

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  let html = "<h2>⚠️ Phân tích & cảnh báo tư tưởng</h2>";

  html += `
    <label>Đơn vị:</label>

    <select id="filterDonVi" onchange="locCanhBao()">
      <option value="">--Tất cả--</option>
      ${[...new Set(ds.map(d=>d.donvi))].map(dv=>
        `<option value="${dv}">${dv}</option>`
      ).join('')}
    </select>

    <label>Cấp bậc:</label>

    <select id="filterCapBac" onchange="locCanhBao()">
      <option value="">--Tất cả--</option>
      ${[...new Set(ds.map(d=>d.capbac))].map(cb=>
        `<option value="${cb}">${cb}</option>`
      ).join('')}
    </select>

    <div id="danhsachCanhBao"></div>
  `;

  document.getElementById("lesson-content").innerHTML=html;

  locCanhBao();
}

function locCanhBao(){

  let dv = document.getElementById("filterDonVi").value;
  let cb = document.getElementById("filterCapBac").value;

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  let html = `
    <table style="width:100%;border-collapse:collapse">
      <tr>
        <th>Họ tên</th>
        <th>Cấp bậc</th>
        <th>Đơn vị</th>
        <th>Điểm gần nhất</th>
        <th>Xu hướng</th>
        <th>Cảnh báo</th>
      </tr>
  `;

  ds.filter(h=>
    (dv===""||h.donvi==dv) &&
    (cb===""||h.capbac==cb)
  ).forEach(h=>{

    let theoDoi = h.theoDoi || [];

    let diemGannhat = theoDoi.length
      ? theoDoi[theoDoi.length-1].diem
      : h.diem || 0;

    let xuHuong="Ổn định";
    let canhBao="";

    if(theoDoi.length>=3){

      let last3=theoDoi.slice(-3).map(t=>t.diem);

      if(last3[0]>last3[1] && last3[1]>last3[2]){

        xuHuong="Giảm liên tục";
        canhBao="⚠️ Cảnh báo xu hướng xấu 3 ngày liên tiếp";

      }else if(last3[1]>last3[2]){

        xuHuong="Giảm nhẹ";
        canhBao="🔔 Cảnh báo xu hướng xấu";
      }

    }else if(theoDoi.length>=2){

      let last2=theoDoi.slice(-2).map(t=>t.diem);

      if(last2[0]>last2[1]){

        xuHuong="Giảm nhẹ";
        canhBao="🔔 Cảnh báo xu hướng xấu";
      }
    }

    html += `
      <tr>
        <td>${h.hoten}</td>
        <td>${h.capbac}</td>
        <td>${h.donvi}</td>
        <td>${diemGannhat}</td>
        <td>${xuHuong}</td>
        <td>${canhBao}</td>
      </tr>
    `;
  });

  html += "</table>";

  document.getElementById("danhsachCanhBao").innerHTML=html;
}

// ---------------- 6. THEO DÕI TƯ TƯỞNG ----------------

let chartLineInstance=null;

function theoDoiTuTuong(){

  let ds = JSON.parse(localStorage.getItem("hosoQN")) || [];

  let html="<h2>🧠 Theo dõi dao động tư tưởng theo ngày</h2>";

  if(ds.length===0){

    html+="<p>Chưa có dữ liệu.</p>";

    document.getElementById("lesson-content").innerHTML=html;

    return;
  }

  html += `
    <label>Chọn quân nhân:</label>

    <select id="chonNguoi">
      <option value="">--Chọn quân nhân--</option>
      ${ds.map((h,i)=>
        `<option value="${i}">${h.hoten}</option>`
      ).join('')}
    </select>

    <canvas id="chartLine"
      style="margin-top:15px;width:100%;height:300px;">
    </canvas>
  `;

  document.getElementById("lesson-content").innerHTML=html;

  document.getElementById("chonNguoi").addEventListener("change",function(){

    let idx=this.value;

    if(idx==="") return;

    let data=ds[idx].theoDoi||[];

    let labels=data.map(e=>e.ngay);
    let points=data.map(e=>e.diem);

    if(chartLineInstance){
      chartLineInstance.destroy();
    }

    chartLineInstance = new Chart(
      document.getElementById("chartLine").getContext('2d'),
      {
        type:'line',

        data:{
          labels:labels,

          datasets:[{
            label:ds[idx].hoten+' - điểm tư tưởng',
            data:points,
            borderColor:"#007bff",
            backgroundColor:"#007bff33",
            tension:0.3,
            fill:true,
            pointRadius:5
          }]
        },

        options:{
          responsive:true,

          scales:{
            y:{
              min:0,
              max:30,
              title:{
                display:true,
                text:'Điểm tư tưởng'
              }
            },

            x:{
              title:{
                display:true,
                text:'Ngày'
              }
            }
          },

          plugins:{
            legend:{
              display:true,
              position:'top'
            },

            tooltip:{
              callbacks:{
                label:function(context){
                  return `Điểm: ${context.raw}`;
                }
              }
            }
          }
        }
      }
    );
  });
}

</script>
